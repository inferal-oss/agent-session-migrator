name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build and install
        run: |
          make all
          make install PREFIX="$RUNNER_TEMP/agent-session-migrator-install"
          "$RUNNER_TEMP/agent-session-migrator-install/bin/agent-session-migrator" --version
          test -f "$RUNNER_TEMP/agent-session-migrator-install/share/licenses/agent-session-migrator/LICENSE-APACHE"
          test -f "$RUNNER_TEMP/agent-session-migrator-install/share/licenses/agent-session-migrator/LICENSE-MIT"
